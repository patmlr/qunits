# Builds the pure-Python wheel and the sdist and smoke tests the wheel. Pushes and pull requests only build and test.
#
# To release, run this workflow manually on main (Actions > Build and release > Run workflow) and choose the
# semantic version bump. The new version is computed from the latest vX.Y.Z tag, everything is built with it
# and uploaded to PyPI, and finally the tag and a GitHub release with generated notes are created.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump (none only builds)
        type: choice
        options: [none, patch, minor, major]
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ (inputs.release && inputs.release != 'none') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.release && inputs.release != 'none'
        with:
          fetch-depth: 0  # All tags.

      - id: bump
        if: inputs.release && inputs.release != 'none'
        env:
          BUMP: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be made from main."
            exit 1
          fi
          # Only plain vX.Y.Z tags, not e.g. v0.5.0-beta.
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z tag found. Tag the last release first, e.g. git tag v0.5.0 <commit> && git push origin v0.5.0"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Releasing $latest -> v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs derives the dev version from the latest tag.

      - name: Set release version
        if: needs.version.outputs.version
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # The oldest supported version.

      - run: pipx run build

      - name: Smoke test the wheel
        working-directory: ${{ runner.temp }}  # Import the installed wheel, not the checkout.
        run: |
          python -m pip install "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          python -c "
          from qunits import u
          q = (3.0 * u.km / u.ms).to(u.m / u.s)
          assert abs(q.value - 3e6) < 1e-6 and q.unit is u.m / u.s, q
          print(q)
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [version, build]
    if: needs.version.outputs.version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qunits/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write  # PyPI trusted publishing, no API token needed.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Tag and GitHub release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Create the tag and the release.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
