[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "qunits"
dynamic = ["version"]
description = "A performant, verbose and generic physical unit system."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

keywords = ["physics", "units", "quantities", "dimensions"]
authors = [
    {name = "Patrick Müller", email = "pamueller.ikp@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy >= 2.0.2",
    "scipy >= 1.17.1",
]

[project.urls]
homepage = "https://patmlr.github.io/qunits/"
documentation = "https://patmlr.github.io/qunits/doc/doc.html"
download = "https://pypi.org/project/qunits/#files"
source = "https://github.com/patmlr/qunits"
tracker = "https://github.com/patmlr/qunits/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/qunits"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github/",
    ".vscode/**",
    "docs/",
    "examples/",
    "resources/",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
files = "src/qunits"
exclude = []

[tool.ruff]
extend-exclude = [
    "__pycache__",
    "docs/*",
    "examples/*",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "ANN",
    "E",
    "F",
    "I",
    "ICN",
    "ISC",
    "NPY",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "TC",
    "TID",
    "UP",
]

ignore = [
    "ANN003",
    "ANN401",
    "E741",
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["qunits"]
